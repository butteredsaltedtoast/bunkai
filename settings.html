<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunkai Settings</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #cba6f7;
    }

    label {
      font-size: 12px;
      color: #9399b2;
      display: block;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #313244;
      background: #181825;
      color: #cdd6f4;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #cba6f7;
      color: #1e1e2e;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #b4befe;
    }

    #status {
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      color: #a6e3a1;
      min-height: 16px;
    }

    .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    }

    .toggle-row label {
        margin-bottom: 0;
    }

    input[type="checkbox"] {
        width: auto;
        margin-bottom: 0;
        accent-color: #cba6f7;
    }
  </style>
</head>

<body>
    <h2>Bunkai Settings</h2>

    <div class="toggle-row">
        <label for="enabled">Enable Bunkai</label>
        <input type="checkbox" id="enabled" />
    </div>

    <div id="status"></div>
    <script src="settings.js"></script>
</body>
</html>
