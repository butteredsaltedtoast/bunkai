<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bunkai Settings</title>
  <style>
    body {
      --paper: #faf7f0;
      --ink: #1a1a1a;
      --red: #c8361d;
      --muted: #888;
      --line: #ccc;
    }

    body[data-theme="dark"] {
      --paper: #1c1b19;
      --ink: #faf7f0;
      --red: #e5533a;
      --muted: #999;
      --line: #444;
    }

    @media (prefers-color-scheme: dark) {
      body[data-theme="auto"] {
        --paper: #1c1b19;
        --ink: #faf7f0;
        --red: #e5533a;
        --muted: #999;
        --line: #444;
      }
    }


    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.5 system-ui, sans-serif;
      border-top: 3px solid var(--red);
    }

    h2 {
      margin: 0 0 12px;
      font: 17px "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 6px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line);
    }

    .vocab-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 12px;
    }

    .vocab-row button {
      all: unset;
      color: var(--muted);
      cursor: pointer;
    }
    .vocab-row button:hover {
      color: var(--red);
    }

    #vocab-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    #export {
      width: 100%;
      padding: 6px;
      background: var(--paper);
      color: var(--red);
      border: 1px solid var(--red);
      font: inherit;
      cursor: pointer;
    }
    #export:hover {
      background: var(--red);
      color: var(--paper);
    }

    h2 + #vocab-list:empty::after {
      content: "nothing saved yet";
      color: var(--muted);
      font-size: 12px;
    }

    h2:not(:first-of-type) {
      margin-top: 16px;
    }

    label {
      color: var(--ink);
    }

    input[type="checkbox"] {
      accent-color: var(--red);
    }

    select {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 2px 4px;
      font: inherit;
    }

    #status {
      min-height: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
    }

    [hidden] {
      display: none !important;
    }

    #card {
      border: 1px solid var(--line);
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
    }

    #card-front {
      font: 26px "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    }

    #card-back {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .card-buttons button, #start-review {
      margin: 8px 4px 0;
      padding: 4px 12px;
      background: var(--paper);
      color: var(--red);
      border: 1px solid var(--red);
      font: inherit;
      cursor: pointer;
    }

    #review-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

  </style>
</head>

<body>
    <h2>Bunkai Settings</h2>

    <div class="toggle-row">
        <label for="enabled">Enable Bunkai</label>
        <input type="checkbox" id="enabled" />
    </div>

    <div class="toggle-row">
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="toggle-row">
      <label for="translate">sentence translaton<br><small>offline AI, ~80mb download first time</small></label>
      <input type="checkbox" id="translate"/>
    </div>

    <h2>Saved words</h2>
    <div id="vocab-list"></div>
    <button id="export">Export CSV</button>

    <h2>Review</h2>
    <div id="card" hidden>
      <div id="card-front"></div>
      <div id="card-back" hidden></div>
      <div class="card-buttons">
        <button id="show">show</button>
        <button id="again" hidden>again</button>
        <button id="good" hidden>got it</button>
      </div>
    </div>
    <button id="start-review">start review</button>
    <div id="review-status"></div>

    <div id="status"></div>
    <script src="settings.js"></script>
</body>
</html>
